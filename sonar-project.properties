sonar.projectKey=dmytro-zhyr_playwright-sdet-kit
sonar.organization=dmytro-zhyr
sonar.sourceEncoding=UTF-8

# Source and test are declared separately because SonarQube applies different rules to each, and
# getting the split wrong is the usual reason a report about a test repository reads as nonsense.
# Test code is allowed things production code is not — a long literal, a repeated block that names
# the case it covers, an assertion with no consumer — and rules about dead stores or duplicated
# blocks fire constantly if `tests/` is analysed as source.
#
# ⛔ Not `sonar.sources=.`. Everything here is deliberate: an entry that is neither source nor test
# should be absent rather than swept in and then excluded again.
# ⚠️ `.github` was missing here until 3 September 2026, and leaving it out cut the findings from
# 11 to 2. That is not a cleaner report, it is a narrower one — and narrowing scope until a check
# stops seeing anything is the defect this repository is largely about. A workflow is the most
# security-sensitive code here: it is the only code that runs holding secrets.
sonar.sources=.github,api,assertions,data,deployments,po,pipeline,report,schemas,fixtures.ts,playwright.config.ts,eslint.config.mjs
sonar.tests=tests

# 📌 `spec/`, `plans/` and `.claude/` are documentation and vendored tooling, not code this project
# is answerable for. `.claude/skills/` in particular is third-party — see NOTICE — and a quality
# report over someone else's files would be a report about the wrong thing.
sonar.exclusions=node_modules/**,allure-results/**,allure-report/**,test-results/**,playwright-report/**
