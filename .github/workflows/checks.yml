name: checks

# Five jobs, and each answers a different question — the same split the suites make in README.md:
#
#   static    does this code lint, typecheck and pass its own unit tests
#   contract  are this code and these schemas still in agreement with the gate deployment
#   ui        do sign-up, sign-in and publishing still work for a user in a real browser
#   defects   is the deployment each test names still broken
#   security  known vulnerabilities in dependencies, and Snyk Code over our own source
#   quality   maintainability, duplication and the quality gate, from SonarQube Cloud
#   report    one Allure report over whichever of the four ran
#   pages     that report, published from main so it has an address rather than a download
#
# 🔑 The job names are written on one axis on purpose — `id — what is measured, against what` —
# because a checks list is scanned, not read. They were five different axes until 31 August 2026:
# the tools for one job, the kind of test for another, an artifact for the fifth, and the word
# "gate" carrying two meanings at once — the set of blocking checks, and the deployment under test.
# `against the gate deployment` and `against the UI gate` named two different hosts and looked like
# one thing. The registry exists so that a name is an address, so the names are used.
#
# ⚠️ `ui` said "do the page objects still match the pages" until the same day, and that undersold
# the suite to the point of being wrong. tests/ui/ holds eleven tests about what a user can do —
# register, sign in, be refused a wrong password, publish an article, find it in the global feed, be
# turned away from the editor while anonymous. Page objects are what those tests are *written with*,
# not what they are *about*, and a description that names the tooling instead of the subject invites
# the reader to skip the row.
#
# The first three are the gate and run on every push and pull request. `defects` is monitoring: it
# is red by design, so it runs only on a schedule or by hand and never stands in the gate.
#
# ⚠️ `ui` is in the gate deliberately, and it is the arguable one. Like `contract` it depends on
# somebody else's host being up, so a third party can turn the gate red — but that trade was
# already accepted for `contract`, and for the same reason: both ask whether **our** code is still
# right, and an answer that arrives a day later on a schedule is not a gate. `defects` is the only
# suite whose redness says nothing about this repository, and it is the only one kept out.
#
# 📌 Its other cost is worth naming rather than discovering: every `ui` run registers a dozen `qa_`
# accounts on a third-party demo deployment that has no delete endpoint. They accumulate. The
# prefix is what lets their owner see where they came from.
#
# Actions are pinned to their current major, v7. The plan wrote v4, which was current when it was
# written; three majors have shipped since, and CI is the last place to run a version nobody
# upstream is testing any more.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, and not for coverage. This is the only place in the project where real instability
    # can appear — a public API, a network, somebody else's uptime — and that is the data stage 2
    # needs in order to tell a flake from a deterministically explained failure.
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  static:
    name: static — lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24, not 20: the same version that is installed locally. A local/CI mismatch is the
          # classic source of "works on my machine", and it is paid for while looking for the
          # cause of a failure in the wrong place.
          node-version: 24
          cache: npm

      # `npm ci`, not `npm install`: it requires the lock file and deliberately does not update
      # it. That is the point — CI installs exactly what is installed locally.
      #
      # `--ignore-scripts` because a package's install hook runs with whatever the job holds, and
      # some of these jobs hold secrets. Measured before adding it, 3 September 2026: exactly two
      # of 216 installed packages declare an install hook — `core-js` and `core-js-pure` — and both
      # print a funding banner inside a try/catch. `@playwright/test` has none; browsers arrive
      # through the explicit `playwright install` command below, not through a hook. So this costs
      # nothing here, which is the only reason it is safe to state as a rule.
      - run: npm ci --ignore-scripts

      # ⛔ No `npx playwright install` here, and that is a check rather than an omission. The
      # `unit` project tests this repository's own code and goes nowhere near a browser, so the
      # day one of its tests asks for the `page` fixture this job is where it stops — loudly,
      # because the executable will not be there.
      #
      # ⚠️ This comment used to claim the whole suite was browser-free, and stage 3 made that
      # false without touching this file: `tests/ui/` asks for `page` on purpose. The claim was
      # never enforced either — this job only runs `test:unit`, so a browser test would have
      # sailed past it. The `ui` job below is where a browser is installed on purpose.
      - run: npm run lint
      - run: npm run typecheck
      - run: ./node_modules/.bin/c8 --reporter=none npm run test:unit

      # 🔑 The only suite that feeds coverage, and that is the decision rather than a limitation.
      # What this repository *produces* is the contract, UI and defect suites; what those suites
      # test is somebody else's application. The only tests of the code in this repository are the
      # unit ones, so they are what a coverage figure about this code can honestly be made of.
      #
      # ⚠️ It is not that `contract` and `ui` fail to exercise the framework — they exercise it
      # heavily, and break when it breaks. It is that they break with a message about the API, and
      # only while a third party is reachable. Coverage assembled from them cannot tell "this line
      # is untested" from "the target was down", and a number that cannot be attributed is not a
      # measurement. Measured 4 September 2026: 96% with them, 67.77% without.
      #
      # 📌 `--reporter=none` here: the counters are the artifact, the report is made once, in
      # `quality`, so there is one number rather than several nobody compares.
      - name: Coverage counters
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/tmp/
          retention-days: 7
          if-no-files-found: ignore

      - name: Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-static
          path: allure-results/
          retention-days: 7

  # Parallel to `static`, and deliberately not a dependency of anything: a vulnerable transitive
  # dependency says nothing about whether the contract holds, and a red gate here should not hide
  # the answer to a different question.
  security:
    name: security — dependencies and code, against Snyk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # ⛔ Not `snyk/actions/node@master`. Snyk publishes its action only on a moving branch, and
      # this repository pins everything else it runs. The version is pinned in the npm script
      # instead — `npx --yes snyk@1.1307.0` — so CI and a laptop run the same scanner.
      #
      # ⚠️ It was a devDependency for about an hour on 3 September 2026, by analogy with
      # `allure-commandline`. The analogy was wrong, and the scanner said so itself: installing it
      # put `snyk > global-agent > semver@7.3.8` in the tree, and that ReDoS was **the only
      # vulnerability the scan found**. `overrides` cannot reach it — snyk bundles its
      # dependencies. A scanner that is part of what it scans reports on itself, so it is not
      # part of it.
      #
      # 📌 `npm run snyk:deps` works on a laptop too. A check that only exists on CI is a check
      # nobody runs while writing the thing it would have caught.

      # A missing token fails the job. The alternative — skipping when the secret is absent — is a
      # security check that reports success while looking at nothing, which is the exact defect
      # this repository spent a week on in D-12. If this job is red because nothing is configured,
      # that is the correct report.
      - name: The token is configured
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN" || {
            echo "SNYK_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          }

      # 🔑 `--dev` is the flag that makes this a check at all. Snyk tests **production**
      # dependencies by default, and this package has none — it is private, unpublished, and
      # everything it uses is development tooling. Measured 3 September 2026: **216 dependencies
      # with the flag, and without it Snyk does not even print a count** — it prints a green tick
      # over nothing. That is the purest form of the defect this repository spent a week on in
      # D-12: a check that passes because it is not looking.
      #
      # ⛔ Do not "fix" that by moving packages back into `dependencies` to feed the scanner. The
      # split answers one question — what must come with this package if someone installs it —
      # and nobody installs this one. The flag is the answer; the split is not.
      #
      # `--severity-threshold=high` is a starting position, and it is now measured rather than
      # assumed: `npm audit` and `snyk test --dev` both report 0 at every severity, and
      # `snyk code test` reports 0 down to `low`. Tightening would change nothing today, so the
      # threshold stays where a real finding will be worth acting on.
      #
      # ⛔ No `.snyk` policy file. There is nothing to ignore, and writing an ignore file before
      # there is something to ignore builds policy for a problem that does not exist.
      - name: Dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npm run snyk:deps

      # Snyk Code is static analysis over this repository's own source, not a lookup in a
      # vulnerability database.
      #
      # 📌 Its first run found one HIGH — `javascript/HardcodedNonCryptoSecret` on a constant then
      # called `TOKEN_KEY`, holding the string `'jwtToken'`. There is no secret there: it is the
      # name of a localStorage key belonging to the application under test, readable in any
      # browser's devtools. But the finding was **half right** — the name did imply a secret — so
      # the fix was to rename it `LOCAL_STORAGE_SESSION_KEY` rather than to suppress the rule. The
      # name is better on its own merits; the scanner just noticed it first.
      #
      # ⚠️ `// deepcode ignore <rule>: <reason>` was tried before the rename and had no effect on
      # this version. If something here ever genuinely needs suppressing, it is not that.
      - name: Our own code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npm run snyk:code

      # The machine-readable half of both scans. Each script writes its file as it runs, so the
      # artifact exists whether the scan was clean or not — `!cancelled()`, because a scan that
      # found something is exactly the one worth reading afterwards.
      #
      # 📌 Turned into HTML in `report`, not here: converting needs the files and not the token, and
      # the fewer jobs that hold a secret the better.
      - name: Snyk findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: snyk-report
          path: |
            snyk-dependencies.json
            snyk-code.sarif
          retention-days: 7
          if-no-files-found: ignore

  # Parallel to `static` and `security`, and a dependency of nothing, for the same reason: what
  # SonarQube says about maintainability is a different question from whether the contract holds.
  #
  # ⛔ Automatic Analysis is switched off in the project's settings, and it has to stay off — the
  # two cannot both run, and the CI one fails loudly saying so. It is off on purpose rather than by
  # accident: analysis belongs in this checks list, beside `static` and `security`, not on a
  # dashboard nobody opens. It is also the only way to control the split below.
  #
  # 🔑 That split is the whole reason to configure this rather than let it scan: `sonar.tests`
  # tells SonarQube which files are tests, and rules about duplication and dead stores are applied
  # differently to them. Analysed as source, `tests/` would produce a page of findings about test
  # code being test-shaped.
  #
  # ⚠️ Unlike `security`, this one has no local command, and that is a deliberate exception to the
  # rule stated there — "a check that only exists on CI is a check nobody runs". It does not
  # transfer: a scanner run from a laptop publishes into the same project, so a dirty working tree
  # would enter the analysis history and the trend would stop meaning anything. The rule is about
  # checks that could run locally without side effects. This one has one.
  quality:
    name: quality — maintainability, duplication and coverage, against SonarQube Cloud
    # `needs: static` only, since that is where coverage now comes from. It used to wait on every
    # suite, which was right while coverage was assembled from all of them and is dead weight now.
    needs: static
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # ⛔ Not the default shallow clone. SonarQube reads blame to attribute an issue to the
          # change that introduced it, which is what makes "new code" a meaningful category rather
          # than a synonym for "the whole file".
          fetch-depth: 0

      - name: The token is configured
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || {
            echo "SONAR_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          }

      - run: npm ci --ignore-scripts

      # `continue-on-error` and the check below have the same shape as in `report`: a run that
      # stopped before the unit tests ran has nothing to report on, and that is a sentence rather
      # than a failure. The pattern stays plural so a second deterministic suite would join without
      # touching this step.
      - name: Collect the coverage counters of every suite that ran
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage/tmp/
          merge-multiple: true

      # 🔑 `--all` is what makes the number honest, and it lives in `.c8rc.json` so a collecting run
      # and this one cannot disagree about it. Without it c8 reports only the files something
      # loaded, so a file no test touches leaves the denominator instead of scoring zero. Measured
      # 3 September 2026 from one run: 96.72% over ten files, 66.91% over all of them. The first
      # number is not a better result, it is a smaller question.
      - name: One report over all of them
        run: |
          if [ -d coverage/tmp ] && [ -n "$(ls -A coverage/tmp 2>/dev/null)" ]; then
            ./node_modules/.bin/c8 report --reporter=lcov --reporter=text-summary
          else
            echo "No suite produced coverage counters; SonarQube will see none and say so."
          fi

      # ⛔ No `-Dsonar.qualitygate.wait=true`. That flag fails on **whatever SonarQube's gate says**,
      # and the gate this project is judged by is the built-in "Sonar way": it cannot be edited, a
      # custom one cannot be assigned on the free plan, and it requires 80% coverage on new code.
      # This repository reports coverage from unit tests only and stands at 67.77% by design — see
      # CONVENTIONS.md, "What coverage counts" — so the flag would paint the job red every run for
      # a condition we deliberately do not hold. A check that is always red is a check nobody reads.
      #
      # The step after the scan states the gate we actually mean, condition by condition.
      #
      # Pinned to a commit, not to `v8.2.1`. A tag can be moved by whoever owns the repository;
      # a commit cannot. SonarQube's own `githubactions:S7637` asked for this, and it is the same
      # rule this file already applied when it refused Snyk's `@master` — it just had not been
      # applied to the action added to satisfy that rule. `actions/*` are exempt: GitHub owns them.
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 🔑 The gate, written out rather than delegated. Every condition SonarQube evaluated is
      # checked here except `new_coverage`, and the exception is named in the output rather than
      # hidden in a setting: coverage is measured, printed and not blocking, because a figure that
      # cannot distinguish "untested" from "the target was down" cannot justify a red build.
      #
      # ⚠️ Reading the conditions needs the analysis to have finished, which is what the flag used
      # to wait for. `report-task.txt` is what the scanner leaves behind to make that possible.
      - name: The conditions this repository treats as blocking
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # ⚠️ Downloaded to a file and then read, never piped into node. `curl … | node -e` is
          # indistinguishable from `curl … | sh` to a reader and to a scanner, and
          # `githubactions:S8482` said so — three findings at once, from the step added to state
          # this gate. Fetching and parsing are different acts and now look different.
          task_url=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d= -f2-)

          for _ in $(seq 1 60); do
            curl -sS -u "$SONAR_TOKEN:" "$task_url" -o task.json
            status=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("task.json","utf8")).task.status)')
            [ "$status" = "PENDING" ] || [ "$status" = "IN_PROGRESS" ] || break
            sleep 5
          done
          test "$status" = "SUCCESS" || { echo "Analysis did not finish: $status"; exit 1; }

          analysis=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("task.json","utf8")).task.analysisId)')
          curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?analysisId=$analysis" \
            -o gate.json

          node -e '
            const s = JSON.parse(require("fs").readFileSync("gate.json", "utf8")).projectStatus;
            const reported = ["new_coverage"];
            let failed = 0;
            for (const c of s.conditions) {
              const blocking = !reported.includes(c.metricKey);
              const bad = c.status === "ERROR";
              if (bad && blocking) failed += 1;
              console.log(
                `${bad ? "FAIL" : "ok  "}  ${blocking ? "blocking" : "reported"}  ` +
                `${c.metricKey} = ${c.actualValue} (${c.comparator} ${c.errorThreshold})`
              );
            }
            console.log("");
            if (failed) {
              console.error(failed + " blocking condition(s) failed.");
              process.exit(1);
            }
            console.log("Every blocking condition holds.");
          '

  contract:
    name: contract — schemas vs conduit-gate
    # After `static`, because the contract tests hit a live third-party API. If that deployment
    # is down, only this job goes red and lint, types and unit tests stay a trustworthy signal
    # about the code.
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Repository variables, never secrets: the URL of a public Conduit deployment is not a
      # secret, and this project has no secrets at all. Putting non-secret configuration into
      # `secrets` is the habit that ends with nobody knowing what is actually in there.
      #
      # ⚠️ Why this is a step and not an `env:` block on the run below. `env: CONDUIT_API_URL:
      # ${{ vars.CONDUIT_API_URL }}` exports the variable as an *empty string* when the
      # repository does not define it, and `resolveDeployment` throws on set-but-empty by
      # design — an empty base URL would send every request to nowhere. Worse, playwright.config
      # resolves `conduit-gate` and `conduit-unsound` when it loads, so an empty variable would
      # break even a job that touches no network. So a name is overridden only when a variable
      # actually carries a value; otherwise the default in deployments/registry.ts stands and the
      # repository runs with no variables set at all.
      - name: Point deployments at repository variables, if any are configured
        env:
          GATE_URL: ${{ vars.CONDUIT_API_URL }}
        run: |
          if [ -n "$GATE_URL" ]; then
            echo "CONDUIT_API_URL=$GATE_URL" >> "$GITHUB_ENV"
            echo "conduit-gate: overridden by the CONDUIT_API_URL repository variable"
          else
            echo "conduit-gate: no repository variable set, keeping the default in deployments/registry.ts"
          fi

      # One worker, pinned by the `test:contract` script itself — see D-4 in spec/FINDINGS.md.
      - run: npm run test:contract

      - name: Playwright report
        # `!cancelled()`, not `always()`: a run somebody cancelled by hand should not spill
        # artifacts.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-contract
          path: allure-results/
          retention-days: 7

  ui:
    name: ui — user flows in a browser, against conduit-overstrict
    # `needs: static` for the same reason `contract` has it: if the code does not lint or its own
    # unit tests fail, a browser run adds noise rather than information.
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Chromium only. The suite runs one project against one browser, and installing three would
      # download about 400 MB to leave two of them unused. `--with-deps` because a GitHub runner
      # has no shared libraries a browser needs.
      # The binary out of `node_modules`, not `npx` and not `npm exec`. Both of those are install
      # commands that happen to also run things, so a rule about installing fires on them — and
      # `npm exec --no` still did, which is fair: the reader cannot tell from the line alone that
      # nothing can be fetched. A path into `node_modules/.bin` says it and cannot do otherwise.
      #
      # ⚠️ **Written once and broken within the hour.** The `c8` lines added on 3 September used
      # `npx` again and raised ten of these at once. A rule applied by hand to the lines in front of
      # you is not applied — it is remembered, and the next commit forgets it. Every binary this
      # workflow runs now comes out of `node_modules/.bin`, and that is the sentence to check
      # against, not the one occurrence that prompted it.
      - run: ./node_modules/.bin/playwright install --with-deps chromium

      # Two variables, because the UI project names one deployment and uses both of its surfaces:
      # conduit-overstrict's API for setting an account up, and its browser UI for the test
      # itself. The same set-but-empty trap applies as in `contract` above — playwright.config
      # resolves the UI address when it loads, so an empty override would break the job before a
      # single test ran.
      - name: Point deployments at repository variables, if any are configured
        env:
          OVERSTRICT_API_URL: ${{ vars.CONDUIT_OVERSTRICT_API_URL }}
          OVERSTRICT_UI_URL: ${{ vars.CONDUIT_OVERSTRICT_UI_URL }}
        run: |
          if [ -n "$OVERSTRICT_API_URL" ]; then
            echo "CONDUIT_OVERSTRICT_API_URL=$OVERSTRICT_API_URL" >> "$GITHUB_ENV"
            echo "conduit-overstrict API: overridden by the CONDUIT_OVERSTRICT_API_URL repository variable"
          else
            echo "conduit-overstrict API: no repository variable set, keeping the default in deployments/registry.ts"
          fi
          if [ -n "$OVERSTRICT_UI_URL" ]; then
            echo "CONDUIT_OVERSTRICT_UI_URL=$OVERSTRICT_UI_URL" >> "$GITHUB_ENV"
            echo "conduit-overstrict UI: overridden by the CONDUIT_OVERSTRICT_UI_URL repository variable"
          else
            echo "conduit-overstrict UI: no repository variable set, keeping the default in deployments/registry.ts"
          fi

      - run: npm run test:ui

      - name: Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ui
          path: playwright-report/
          retention-days: 14

      - name: Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ui
          path: allure-results/
          retention-days: 7

  defects:
    name: defects — conduit-unsound, red by design, not a gate
    # Schedule or by hand only. These tests assert the specification against deployments that
    # violate it, so they are red until somebody else fixes their API. In the gate they would
    # block every commit over a bug this repository does not control.
    #
    # It does not `need: static` either: monitoring somebody else's API is not blocked by whether
    # this code lints.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Two names, because this suite is about two deployments: the project's default target is
      # `conduit-unsound` (D-1 to D-5), and the tests that name `conduit-gate` reproduce D-6 to
      # D-12 on the gate's own deployment. `conduit-overstrict` is in the registry but no test
      # names it yet, so there is nothing here to override.
      #
      # ⛔ Do not point CONDUIT_DEFECTS_API_URL at a conforming deployment. These tests assert the
      # specification, so a healthy target turns them green — and green here is supposed to mean
      # the defect was fixed.
      - name: Point deployments at repository variables, if any are configured
        env:
          GATE_URL: ${{ vars.CONDUIT_API_URL }}
          DEFECTS_URL: ${{ vars.CONDUIT_DEFECTS_API_URL }}
        run: |
          if [ -n "$GATE_URL" ]; then
            echo "CONDUIT_API_URL=$GATE_URL" >> "$GITHUB_ENV"
            echo "conduit-gate: overridden by the CONDUIT_API_URL repository variable"
          else
            echo "conduit-gate: no repository variable set, keeping the default in deployments/registry.ts"
          fi
          if [ -n "$DEFECTS_URL" ]; then
            echo "CONDUIT_DEFECTS_API_URL=$DEFECTS_URL" >> "$GITHUB_ENV"
            echo "conduit-unsound: overridden by the CONDUIT_DEFECTS_API_URL repository variable"
          else
            echo "conduit-unsound: no repository variable set, keeping the default in deployments/registry.ts"
          fi

      # Expected to fail. A green run here is the news: it means a defect was fixed.
      - run: npm run test:defects

      - name: Defects report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: defects-report
          path: playwright-report/
          retention-days: 30

      - name: Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-defects
          path: allure-results/
          retention-days: 7

  report:
    name: report — Allure over every suite that ran
    # Every job above, so a scheduled run reports on all four and a push reports on the three that
    # ran. `!cancelled()` rather than `always()` or `success()`: a red suite is exactly when the
    # report is worth reading, and a run somebody stopped by hand is exactly when it is not.
    #
    # A skipped dependency would normally skip this job too — `defects` is skipped on every push —
    # and the `if` is what overrides that.
    needs: [static, contract, ui, defects]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # For allure-commandline, which is a devDependency. The report is built by the same script
      # that builds it locally — `npm run allure:generate` — so a report assembled here and one
      # assembled on a laptop cannot drift apart.
      - run: npm ci --ignore-scripts

      # Merged into one directory, which is what produces one report over four suites instead of
      # four reports nobody compares. Each job uploaded its own results under its own name because
      # two artifacts may not share one.
      - name: Collect the results of every suite that ran
        # `continue-on-error`, because there is a legitimate case with nothing to download: a run
        # that failed at lint never reached a test and uploaded no results. The step after this
        # one turns that into a skip.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results/
          merge-multiple: true

      # ⛔ Without this the job would go red whenever no suite produced results — a report job
      # failing for a reason that is not about the report, which is the same confusion the Allure
      # categories exist to prevent one level down. Nothing to report is not a failure; it is a
      # sentence saying so.
      - name: Is there anything to report
        id: results
        run: |
          if [ -d allure-results ] && [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Collected results from $(ls allure-results | wc -l) files."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No suite produced Allure results — most likely the run stopped before any test ran."
          fi

      # 🔑 The trend, and the only reason this job is more than `allure generate`.
      #
      # History lives inside the generated report, and a runner keeps nothing between runs — so
      # without a cache every report on CI would show a trend of exactly one point and quietly
      # look complete. The key changes every run so a new entry is always written; `restore-keys`
      # is the prefix that finds the most recent previous one.
      #
      # ⚠️ Restored **before** generating, because `allure:generate` reads `allure-report/history`
      # and carries it into the results. Saved automatically at the end of the job, by which time
      # `--clean` has rebuilt that directory with this run added to it.
      - name: Restore the trend from previous runs
        if: steps.results.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: allure-report/history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - if: steps.results.outputs.present == 'true'
        run: npm run allure:generate

      # ⚠️ **This block used to say the report is deliberately not on GitHub Pages**, because "this
      # repository is private, and Pages would put the report — deployment URLs, test names,
      # failure messages — on a public address". The premise was named with the decision, and on
      # 3 September 2026 it stopped holding: the repository is public, so none of those three is a
      # disclosure any more. The decision is reversed rather than quietly edited away.
      #
      # 📌 The artifact stays alongside Pages. They answer different questions — Pages is the
      # latest report at a link somebody can open, the artifact is *this* run's report thirty days
      # from now. Keeping one would lose the other.
      #
      # It must be served rather than opened from the filesystem: `npx allure open allure-report`
      # after unzipping. Opening index.html directly shows an empty page — which is also why Pages
      # works, since Pages serves it.
      - name: Allure report
        if: steps.results.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Collect the Snyk findings
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: snyk-report
          path: snyk/

      # 🔑 One site with an index, rather than dropping a reader into the middle of Allure. The
      # index is a committed file, not a generated one: it has no logic, so it cannot drift, and it
      # is reviewable in the diff like anything else.
      #
      # ⛔ SonarQube is a link on that page, not a copy. It has no HTML export, so a local version
      # would mean rebuilding its UI from the API — worse on every axis, and stale the moment it is
      # written. The project is public, so the live report already has an address.
      - name: Assemble the site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/snyk
          cp report/pages/index.html site/index.html
          if [ -d allure-report ]; then cp -r allure-report site/allure; fi
          for pair in "snyk/snyk-dependencies.json:dependencies" "snyk/snyk-code.sarif:code"; do
            src=${pair%%:*}
            name=${pair##*:}
            if [ -f "$src" ]; then
              ./node_modules/.bin/snyk-to-html -i "$src" -o "site/snyk/$name.html"
            else
              echo "<!doctype html><title>Snyk — $name</title><p>This run produced no $name report."                 > "site/snyk/$name.html"
            fi
          done
          find site -maxdepth 2 -type d -o -type f -name '*.html' | sort

      - name: Package the site for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  # A job of its own because deploying needs write permissions the reporting job should not carry,
  # and because a failed deployment must not make the report itself look broken.
  #
  # ⛔ Only from `main`. A report published from a branch would overwrite the one a reader was
  # sent, with results from work in progress.
  pages:
    name: pages — the latest report from main, at a link
    needs: report
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
